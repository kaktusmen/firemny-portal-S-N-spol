<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firemný Portál</title>
  
  <!-- Stabilné Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    window.openSection = function(secId, title) {
      try {
        var mainMenu = document.getElementById('mainMenu');
        var titleEl = document.getElementById('pageHeaderTitle');
        var subtitleEl = document.getElementById('pageHeaderSubtitle');
        
        if (mainMenu) mainMenu.style.display = 'none';
        if (titleEl) titleEl.innerText = title;
        if (subtitleEl) subtitleEl.style.display = 'none';

        var sections = document.querySelectorAll('.section-content');
        for (var i = 0; i < sections.length; i++) {
          sections[i].style.display = 'none';
        }
        var target = document.getElementById(secId);
        if (target) target.style.display = 'block';
        
        if (secId === 'calendarSection' && typeof renderCalendar === 'function') renderCalendar();
        if (secId === 'clientsSection' && typeof updateMontazSelectOptions === 'function') updateMontazSelectOptions();
        if (secId === 'montazSection' && typeof updateClientDropdown === 'function') updateClientDropdown();
      } catch(err) {
        console.error("OpenSection error:", err);
      }
    };

    window.goHome = function() {
      try {
        var sections = document.querySelectorAll('.section-content');
        for (var i = 0; i < sections.length; i++) {
          sections[i].style.display = 'none';
        }
        var mainMenu = document.getElementById('mainMenu');
        var titleEl = document.getElementById('pageHeaderTitle');
        var subtitleEl = document.getElementById('pageHeaderSubtitle');

        if (mainMenu) mainMenu.style.display = 'grid';
        if (titleEl) titleEl.innerText = 'Firemný Portál';
        if (subtitleEl) subtitleEl.style.display = 'block';
      } catch(err) {
        console.error("GoHome error:", err);
      }
    };
  </script>
